# ========================================
# 100 Robots Mixed Demo Configuration
# ========================================
#
# Config-driven mixed fleet scene:
# - 50 Husky mobile robots
# - 50 fixed-base arm_robot arms

simulation:
  target_rtf: 0
  gui: true
  timestep: 0.1
  physics: true
  monitor: true
  enable_monitor_gui: true
  log_level: info
  enable_time_profiling: true
  profiling_interval: 100
  camera:
    camera_mode: auto
    camera_view_type: perspective
    camera_auto_scale: 0.6

managers:
  - name: mobile_fleet
    fleet_controller:
      type: batch_omni
      max_linear_vel: 2.0
      max_linear_accel: 5.0
  - name: arm_fleet
    fleet_controller:
      max_linear_vel: 0.0
      max_linear_accel: 0.0

entities:
  - name: mobile
    urdf_path: "husky"
    use_fixed_base: false
    # Used when 100robots_mixed_demo.py runs with --controller per_agent.
    controller:
      type: "omni"
    manager: mobile_fleet
    user_data:
      robot_type: "mobile_robot"
    grid:
      count: 50
      columns: 7
      spacing: [2.0, 2.0, 0.0]
      offset: [-9.0, -4.0, 0.3]

  - name: arm
    urdf_path: "arm_robot"
    use_fixed_base: true
    mass: 1.0
    controller:
      type: "differential"
    manager: arm_fleet
    user_data:
      robot_type: "arm_robot"
    grid:
      count: 50
      columns: 7
      spacing: [2.0, 2.0, 0.0]
      offset: [-8.0, -3.0, 0.0]
