# ========================================
# 100 Robots Demo Configuration
# ========================================
#
# Additional configuration for 100robots demo.
# This file is merged with config.yaml.
#
# ========================================

# ========================================
# Simulation Parameters (Override)
# ========================================
simulation:
  # Override base config settings for 100robots demo
  target_rtf: 0     # real-time cap (0 = uncapped/max speed, run as fast as possible)
  gui: true         # Show GUI
  timestep: 0.1     # 100ms timestep (10 Hz) for smooth movement
  physics: false    # Kinematic control
  monitor: true     # Enable monitor
  enable_monitor_gui: true  # Show the tkinter monitor window when available
  log_level: info   # Show INFO level logs for profiling

  # Profiling configuration
  enable_time_profiling: true
  profiling_interval: 100  # Print average every 100 steps

  # Camera settings for 100 robots
  camera:
    camera_mode: auto              # Use auto mode for automatic camera positioning
    camera_view_type: perspective  # Perspective view for grid visualization
    camera_auto_scale: 0.5         # Scale factor for camera distance (larger = farther away)

# ========================================
# Entity Grid Spawn (Primary Pattern)
# ========================================

entities:
  - name: robot
    urdf_path: "robots/mobile_robot.urdf"
    motion_mode: omnidirectional
    batch_controller: batch_omni
    use_fixed_base: false
    controller:
      type: "omni"
      max_linear_vel: 2.0
      max_linear_accel: 5.0
    user_data:
      robot_type: "mobile_robot"
    grid:
      count: 100
      columns: 10
      spacing: [2.0, 2.0, 0.0]
      offset: [0.0, 0.0, 0.3]
