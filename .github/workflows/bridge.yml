name: Bridge Integration

# ros2_bridge is excluded from pre-commit and pytest (it needs a ROS 2 runtime),
# so this Docker job is its only automated coverage. Path-filtered: it runs only
# when the bridge, its Docker setup, or bundled robot/world assets change, so
# ordinary PRs stay fast.
on:
  push:
    branches: [ main ]
    paths:
      - 'ros2_bridge/**'
      - 'docker/**'
      - 'pybullet_fleet/robots/**'
      - 'pybullet_fleet/config/**'
      - 'pybullet_fleet/mesh/**'
      - '.github/workflows/bridge.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ros2_bridge/**'
      - 'docker/**'
      - 'pybullet_fleet/robots/**'
      - 'pybullet_fleet/config/**'
      - 'pybullet_fleet/mesh/**'
      - '.github/workflows/bridge.yml'

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: ROS 2 Bridge Integration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build bridge image
        run: docker compose -f docker/docker-compose.yaml build bridge

      - name: Run bridge unit tests (colcon)
        # In-package pytest unit tests for pybullet_fleet_ros and pybullet_fleet_rmf,
        # run inside the built image so rclpy and the message types (incl. RMF) are
        # available. The two @pytest.mark.launch_test files are excluded here:
        # launch_testing's TestCases each call rclpy.init() in setUpClass and
        # conflict when co-run in one pytest process ("Context.init() must only be
        # called once"). The running-bridge behaviour they cover is exercised by the
        # bridge API check below; run them standalone with `launch_test`.
        run: |
          docker compose -f docker/docker-compose.yaml run --rm --no-deps bridge bash -c '
            source /opt/ros/jazzy/setup.bash
            source /rmf_demos_ws/install/setup.bash
            cd /rmf_demos_ws
            colcon test --packages-select pybullet_fleet_ros pybullet_fleet_rmf \
              --return-code-on-test-failure --event-handlers console_direct+ \
              --pytest-args -m "not launch_test"
          '

      - name: Run bridge API check
        # test_bridge_api.sh spawns robot0/1/2 from bridge_test.yaml (gui:=false)
        # and bridge_api_check.py checks topics, services, cmd_vel, simulation_interfaces,
        # and fleet API calls.
        run: |
          cd docker
          docker compose run --rm --no-deps \
            -v "$(pwd):/docker:ro" \
            bridge bash /docker/test_bridge_api.sh

      - name: Run RMF stack check
        # Launches the headless office RMF demo and asserts the RMF stack stands
        # up (fleet/door/lift/dispenser/ingestor topics) and the bridge executes
        # a direct NavigateToPose (deterministic: no dispatcher/traffic-schedule
        # dependency). This is the blocking RMF gate.
        run: |
          cd docker
          docker compose run --rm --no-deps \
            -v "$(pwd)/test_rmf_stack.sh:/test_rmf_stack.sh:ro" \
            -v "$(pwd)/rmf_stack_check.py:/rmf_stack_check.py:ro" \
            bridge bash /test_rmf_stack.sh

      - name: Run RMF dispatch flow (office — patrol + delivery)
        # Full dispatch chain through RMF's dispatcher + traffic schedule, each task
        # asserted to reach `completed`. Office covers navigation (patrol) and the
        # workcell pick/drop path (delivery: coke_dispenser -> coke_ingestor).
        # --use_sim_time is essential (demos run RMF on /clock; without it a task's
        # earliest-start is stamped from the wall clock, lands in the sim-time future,
        # and sits in `queued` forever).
        run: |
          cd docker
          docker compose run --rm --no-deps \
            -v "$(pwd)/test_rmf_dispatch.sh:/test_rmf_dispatch.sh:ro" \
            -v "$(pwd)/rmf_dispatch_flow_check.py:/rmf_dispatch_flow_check.py:ro" \
            bridge bash /test_rmf_dispatch.sh --allow-fleet-state-clear-fallback office_pybullet \
              "patrol:lounge,coe" \
              "delivery:pantry,coke_dispenser,hardware_2,coke_ingestor"

      - name: Run RMF readiness smoke (hotel — multi-fleet + lift config)
        # Hotel adds multiple fleets plus lift/door configuration. The dispatch
        # patrol/clean scenarios are intentionally not a blocking CI gate yet:
        # with python_fleet completion is currently proximity-based, and the hotel
        # demo can replan long enough that terminal task success is not reliable
        # within CI time limits. Office remains the full dispatch-flow gate.
        run: |
          cd docker
          docker compose run --rm --no-deps \
            -v "$(pwd)/test_rmf_dispatch.sh:/test_rmf_dispatch.sh:ro" \
            -v "$(pwd)/rmf_dispatch_flow_check.py:/rmf_dispatch_flow_check.py:ro" \
            bridge bash /test_rmf_dispatch.sh --ready-only hotel_pybullet
